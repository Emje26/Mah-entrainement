# frozen_string_literal: true

fr:
  activerecord:
    models:
      user:
        one: Utilisateur
        other: Utilisateurs
      item:
        one: Article
        other: Articles
    attributes:
      user:
        name: Nom
        email: Email
        password: Mot de passe
        password_confirmation: Confirmation du mot de passe
        created_at: Créé le
        updated_at: Mis à jour le
      item:
        name: Nom
        description: Description
        price: Prix
        quantity: Quantité
        created_at: Créé le
        updated_at: Mis à jour le
    errors:
      messages:
        record_invalid: "La validation a échoué : %{errors}"
        restrict_dependent_destroy:
          has_one: "Impossible de supprimer l'enregistrement car un %{record} dépendant existe"
          has_many: "Impossible de supprimer l'enregistrement car des %{record} dépendants existent"

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
      long: "%d %B %Y"
    day_names:
      - dimanche
      - lundi
      - mardi
      - mercredi
      - jeudi
      - vendredi
      - samedi
    abbr_day_names:
      - dim
      - lun
      - mar
      - mer
      - jeu
      - ven
      - sam
    month_names:
      - ~
      - janvier
      - février
      - mars
      - avril
      - mai
      - juin
      - juillet
      - août
      - septembre
      - octobre
      - novembre
      - décembre
    abbr_month_names:
      - ~
      - jan.
      - fév.
      - mar.
      - avr.
      - mai
      - juin
      - juil.
      - août
      - sept.
      - oct.
      - nov.
      - déc.
    order:
      - :day
      - :month
      - :year

  time:
    formats:
      default: "%d %B %Y %H:%M"
      short: "%d %b %H:%M"
      long: "%A %d %B %Y %H:%M"
    am: "am"
    pm: "pm"

  number:
    format:
      separator: ","
      delimiter: " "
      precision: 2
    currency:
      format:
        format: "%n %u"
        unit: "€"
        separator: ","
        delimiter: " "
        precision: 2
    percentage:
      format:
        delimiter: ""
    precision:
      format:
        delimiter: ""
    human:
      format:
        delimiter: ""
        precision: 3

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "doit être accepté"
      blank: "doit être rempli"
      confirmation: "ne correspond pas à la confirmation"
      empty: "doit être rempli"
      equal_to: "doit être égal à %{count}"
      even: "doit être pair"
      exclusion: "est réservé"
      greater_than: "doit être supérieur à %{count}"
      greater_than_or_equal_to: "doit être supérieur ou égal à %{count}"
      in: "doit être dans l'intervalle %{count}"
      inclusion: "n'est pas inclus dans la liste"
      invalid: "est invalide"
      less_than: "doit être inférieur à %{count}"
      less_than_or_equal_to: "doit être inférieur ou égal à %{count}"
      model_invalid: "La validation a échoué : %{errors}"
      not_a_number: "n'est pas un nombre"
      not_an_integer: "doit être un nombre entier"
      odd: "doit être impair"
      other_than: "doit être différent de %{count}"
      present: "doit être vide"
      required: "doit exister"
      taken: "est déjà pris"
      too_long:
        one: "est trop long (pas plus d'un caractère)"
        other: "est trop long (pas plus de %{count} caractères)"
      too_short:
        one: "est trop court (au moins un caractère)"
        other: "est trop court (au moins %{count} caractères)"
      wrong_length:
        one: "n'a pas la bonne longueur (doit être d'un caractère)"
        other: "n'a pas la bonne longueur (doit être de %{count} caractères)"

  helpers:
    select:
      prompt: "Veuillez sélectionner"
    submit:
      create: "Créer %{model}"
      submit: "Enregistrer %{model}"
      update: "Modifier %{model}"

  views:
    pagination:
      first: "&laquo; Premier"
      last: "Dernier &raquo;"
      previous: "&lsaquo; Précédent"
      next: "Suivant &rsaquo;"
      truncate: "&hellip;"

  flash:
    actions:
      create:
        success: "%{model} a été créé avec succès."
      update:
        success: "%{model} a été mis à jour avec succès."
      destroy:
        success: "%{model} a été supprimé avec succès."
